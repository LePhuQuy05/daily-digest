[project]
name = "daily-digest"
version = "0.1.0"
description = "Daily AI & tech digest popup for Windows: HN + Hugging Face Daily Papers + arXiv, ranked by an LLM."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "pillow>=13.0.0",
    "pystray>=0.19.5",
    "pywebview>=6.2.1",
    "pyyaml>=6.0",
    "windows-toasts>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
daily-digest = "daily_digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daily_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
