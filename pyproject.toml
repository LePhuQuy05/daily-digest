[project]
name = "daily-digest"
version = "0.2.0"
description = "Daily AI & tech digest popup for Windows: HN + Hugging Face Daily Papers + arXiv, ranked by an LLM."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "LePhuQuy", email = "86889095+LePhuQuy05@users.noreply.github.com" },
]
keywords = ["ai", "llm", "arxiv", "hacker-news", "daily-digest", "pywebview"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "pillow>=13.0.0",
    "pystray>=0.19.5",
    "pywebview>=6.2.1",
    "pyyaml>=6.0",
    "windows-toasts>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
daily-digest = "daily_digest.cli:main"

[project.urls]
Homepage = "https://github.com/LePhuQuy05/daily-digest"
Repository = "https://github.com/LePhuQuy05/daily-digest"
Issues = "https://github.com/LePhuQuy05/daily-digest/issues"
Changelog = "https://github.com/LePhuQuy05/daily-digest/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daily_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
